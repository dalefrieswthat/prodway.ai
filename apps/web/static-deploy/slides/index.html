<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitch Deck — Prodway AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="theme-color" content="#050505">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #050505;
            --surface: #0a0a0a;
            --border: rgba(255, 255, 255, 0.08);
            --fg: #fafafa;
            --fg-secondary: #a1a1aa;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --radius-xs: 6px;
            --transition: 0.2s ease;
        }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--fg);
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration: none; }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
        }
        .nav-inner {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 2rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 0.625rem; }
        .logo-mark {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-xs);
            background: rgba(34, 197, 94, 0.1);
            display: grid;
            place-items: center;
        }
        .logo-mark svg { width: 16px; height: 16px; color: var(--accent); }
        .logo-text { font-weight: 600; font-size: 1rem; }
        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--fg-secondary);
            transition: color var(--transition);
        }
        .nav-back:hover { color: var(--accent); }
        .nav-cta {
            display: inline-flex;
            align-items: center;
            height: 36px;
            padding: 0 1rem;
            font-size: 0.8125rem;
            font-weight: 500;
            border-radius: var(--radius-xs);
            background: var(--accent);
            color: #000;
            transition: background var(--transition);
        }
        .nav-cta:hover { background: var(--accent-hover); }

        main {
            padding-top: 64px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .deck-header {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }
        .deck-header h1 { font-size: 1.125rem; font-weight: 600; color: var(--fg-secondary); }
        .deck-embed {
            flex: 1;
            min-height: 0;
            padding: 1rem 2rem 2rem;
        }
        .deck-embed iframe {
            width: 100%;
            height: 100%;
            min-height: 600px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
        }
        .deck-fallback { padding: 2rem; text-align: center; color: var(--fg-secondary); }
        .deck-fallback a { color: var(--accent); text-decoration: underline; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="logo">
                <div class="logo-mark">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                </div>
                <span class="logo-text">Prodway</span>
            </a>
            <a href="/" class="nav-back">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7 16l-4-4m0 0l4-4m-4 4h18"/>
                </svg>
                Back to home
            </a>
            <a href="/#contact" class="nav-cta">Get in Touch</a>
        </div>
    </nav>

    <main>
        <div class="deck-header">
            <h1>Pitch deck</h1>
        </div>
        <div class="deck-embed">
            <iframe src="Prodway-AI.pdf" title="Prodway AI Pitch Deck"></iframe>
            <noscript>
                <div class="deck-fallback">
                    <p>Enable JavaScript to view the deck inline, or <a href="Prodway-AI.pdf" download>download the PDF</a>.</p>
                </div>
            </noscript>
        </div>
    </main>
</body>
</html>
