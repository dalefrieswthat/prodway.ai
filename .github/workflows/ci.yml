name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 272795262341.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: prodway

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r apps/sowflow/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          python -m pytest tests/ -v || echo "No tests yet"

  build-and-deploy:
    name: Build & Deploy to AWS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::272795262341:role/github-actions-prodway
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push SowFlow
        run: |
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/prodway/sowflow:${{ github.sha }} \
            -t $ECR_REGISTRY/prodway/sowflow:latest \
            -f apps/sowflow/Dockerfile .
          docker push $ECR_REGISTRY/prodway/sowflow:${{ github.sha }}
          docker push $ECR_REGISTRY/prodway/sowflow:latest

      - name: Build and push FormPilot
        run: |
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/prodway/formpilot:${{ github.sha }} \
            -t $ECR_REGISTRY/prodway/formpilot:latest \
            -f apps/formpilot-api/Dockerfile .
          docker push $ECR_REGISTRY/prodway/formpilot:${{ github.sha }}
          docker push $ECR_REGISTRY/prodway/formpilot:latest

      - name: Deploy SowFlow to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service sowflow \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Deploy FormPilot to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service formpilot \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Wait for SowFlow deployment
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services sowflow \
            --region $AWS_REGION

      - name: Wait for FormPilot deployment
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services formpilot \
            --region $AWS_REGION

  deploy-pages:
    name: Deploy Landing Page
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: prodway
          directory: apps/web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
